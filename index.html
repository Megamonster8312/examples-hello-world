<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Megamonster8312 - Profile</title>
  <link rel="stylesheet" href="https://fastly.jsdelivr.net/npm/simple-icons-font@v16/font/simple-icons.min.css">
  <style>
    body {
      background: #0B0B0E;
      color: #fff;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .topbar {
      width: 100%;
      height: 60px;
      background: #0B0B0E;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      padding: 0 24px;
      box-sizing: border-box;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .topbar-brand {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      text-decoration: none;
    }

    .top {
      margin-top: 30px;
      text-align: center;
    }

    .wrapper {
      width: 100%;
      max-width: 600px;
      margin-top: 20px;
      margin-bottom: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #121214;
      padding: 30px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      box-sizing: border-box;
    }

    h1 {
      font-size: clamp(32px, 8vw, 50px);
      font-family: 'Poppins', sans-serif;
      margin-bottom: 20px;
      line-height: 1.2;
      font-weight: 700;
      text-align: center;
    }

    h2 {
      text-align: center;
    }

    ul {
      width: 100%;
      padding-left: 20px;
      box-sizing: border-box;
    }

    li {
      margin-bottom: 10px;
      font-family: 'Muli', sans-serif;
      font-size: clamp(14px, 4vw, 18px);
    }

    .icons {
      text-align: center;
      margin-top: 30px;
    }

    .icons a {
      display: inline-block;
      margin: 10px;
    }

    .icons i {
      color: #00091B;
      background: #fff;
      height: 15px;
      width: 15px;
      padding: 13px;
      border-radius: 50px;
      border: 2px solid #fff;
      transition: all 200ms ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .icons i:hover,
    .icons i:active {
      color: #fff;
      background: none;
      cursor: pointer !important;
      transform: scale(1.2);
      -webkit-transform: scale(1.2);
    }
  </style>
</head>
<body>

  <header class="topbar">
    <span class="topbar-brand">Megamonster8312</span>
  </header>

  <div class="top">
    <h2>Unavailable</h2>
  </div>

</body>
</html>
